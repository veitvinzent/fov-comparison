<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Camera FOV Comparison</title>

    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@photo-sphere-viewer/core@5.15.1/index.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@photo-sphere-viewer/markers-plugin@5.15.1/index.min.css">
    <link rel="stylesheet" href="style.css">

    <script type="importmap">
      {
        "imports": {
          "three": "https://cdn.jsdelivr.net/npm/three@0.186.1/build/three.module.js",
          "@photo-sphere-viewer/core": "https://cdn.jsdelivr.net/npm/@photo-sphere-viewer/core@5.15.1/index.module.min.js",
          "@photo-sphere-viewer/markers-plugin": "https://cdn.jsdelivr.net/npm/@photo-sphere-viewer/markers-plugin@5.15.1/index.module.min.js"
        }
      }
    </script>
    <script type="module" src="main.js"></script>
  </head>
  <body>
    <div id="viewer" style="width: 100vw; height: 100vh;"></div>
    <template id="camera-editor-template">
      <label for="sensor-name">Sensor</label>
      <select id="sensor-name" name="sensor-name">
        <option value="full_frame">Full Frame</option>
        <option value="aps_c">APS-C</option>
        <option value="aps_c_canon">APS-C (Canon)</option>
        <option value="medium_format_fujifilm_gfx">Medium Format (Fujifilm GFX)</option>
        <option value="mirco_four_thirds">Micro Four Thirds</option>
        <option value="one_inch">1 inch</option>
      </select><br>
      <label for="focal-length">Focal length</label>
      <input id="focal-length" name="focal-length" type="number" value="50"><br>
      <label for="color">Color</label>
      <input id="color" name="color" type="text" value="red">
    </template>
  </body>
</html>
